services:

  database:
    image: postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_database:/var/lib/postgresql/data:rw # Persistência dos dados do PostgreSQL
      #- ./logs:/var/log/postgresql:rw # Descomente junto com o 'command' abaixo se quiser log em arquivo
      #- ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    #command:
      #- "postgres"
      #- "-c"
      #- "logging_collector=on"
      #- "-c"
      #- "log_directory=/var/log/postgresql"
      #- "-c"
      #- "log_filename=postgresql.log"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - formdin-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgAdmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: user@domain.com
      PGADMIN_DEFAULT_PASSWORD: 123456
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "8080:80"
    volumes:
      - ./config/servers.json:/pgadmin4/servers.json:ro
    networks:
      - formdin-network
    depends_on:
      database:
        condition: service_healthy

  apache_php:
    build:
      dockerfile: debian13_apache_php85_pgsql.Dockerfile
      context: .
    image: debian13_apache_php85_pgsql:last
    container_name: debian13_apache_php85_pgsql
    restart: always
    ports:
      - "80:80" # Porta para acessar o Apache com HTTP
      - "443:443" # Porta para acessar o Apache com HTTPS
      - "9003:9003" # Porta para o Xdebug (padrão na versão 3)
    networks:
      - formdin-network
    volumes:
      - ./config/php-apache.ini:/etc/php/8.5/apache2/php.ini
      - ./config/php-cli.ini:/etc/php/8.5/cli/php.ini
      - ./config/xdebug.ini:/etc/php/8.5/apache2/conf.d/20-xdebug.ini
      - ./config/apache_default.conf:/etc/apache2/sites-enabled/000-default.conf
      - ./www:/var/www/html:rw # Caminho relativo da pasta www (DOCUMENT_ROOT)
      - ./logs:/var/log/apache2:rw # Caminho relativo da pasta de logs do Apache
    environment:
      XDEBUG_CONFIG: "client_host=host.docker.internal" # Define o IP do host para depuração
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy


networks:
  formdin-network:
    driver: bridge
