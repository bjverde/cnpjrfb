# =====================================================================
# Configurações customizadas do PostgreSQL (config/postgresql.conf)
# =====================================================================
# Para aplicar este arquivo completo no container "database", descomente
# o volume "./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro"
# no docker-compose.yml e use "-c config_file=/etc/postgresql/postgresql.conf".

listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 128MB
timezone = 'America/Sao_Paulo'
log_timezone = 'America/Sao_Paulo'
datestyle = 'iso, dmy'

# Configurações de Log em arquivo (/var/log/postgresql -> pasta ./logs)
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql.log'
log_statement = 'none' # Altere para 'all' ou 'ddl' se quiser registrar todas as queries
