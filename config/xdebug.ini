; =====================================================================
; Configuração do Xdebug 3.x (Mapeado em /etc/php/8.5/apache2/conf.d/20-xdebug.ini)
; =====================================================================
; Por padrão o Xdebug vem ATIVADO para desenvolvimento.
;
; Para DESATIVAR (ganhar performance ou preparar para PRODUÇÃO) sem reconstruir a imagem:
;   1. Comente a linha "zend_extension=xdebug.so" abaixo (adicione ";" no início: ;zend_extension=xdebug.so)
;      ou altere "xdebug.mode = off"
;   2. Reinicie o container: docker-compose restart apache_php
; =====================================================================

zend_extension=xdebug.so

xdebug.mode = develop,coverage,debug
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log = /var/log/apache2/xdebug.log
